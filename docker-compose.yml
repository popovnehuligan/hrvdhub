# The wishlist plus Caddy, which gets and renews the HTTPS certificate for DOMAIN.
# Needs a server with ports 80 and 443 open and DOMAIN pointing at it.
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
services:
  wishlist:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - wishlist_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - wishlist

volumes:
  wishlist_data:
  caddy_data:
