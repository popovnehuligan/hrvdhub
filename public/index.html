<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Horovod Wishlist</title>
    <link rel="icon" href="brand/eye.png" />
    <!-- The wishlist server (the list and new photos) and Google Drive (older photos). -->
    <link rel="preconnect" href="https://hrvd-wishlist.horovod.workers.dev" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link rel="preload" href="brand/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="brand/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <script>
      // Google takes seconds to answer, so the list is asked for now rather than once app.js
      // and its modules have loaded; api.js takes the answer from window.WISHLIST_EARLY.
      // The modules are fetched side by side too (with the same ?v= as config.js).
      // Screen sizes only (no names): how Telegram on each platform shows the app, for fixing layouts.
      function screenInfo() {
        var tg = window.Telegram && window.Telegram.WebApp;
        var vv = window.visualViewport;
        return {
          w: innerWidth, h: innerHeight, dpr: devicePixelRatio,
          vw: vv ? Math.round(vv.width) : null, vh: vv ? Math.round(vv.height) : null,
          sw: screen.width, sh: screen.height,
          platform: tg && tg.platform, version: tg && tg.version, tgvh: tg && tg.viewportHeight,
          expanded: tg && tg.isExpanded, fullscreen: tg && tg.isFullscreen,
          ua: navigator.userAgent.slice(0, 160)
        };
      }
      window.WISHLIST_SCREEN = screenInfo;
      (function () {
        try {
          var version = (/\?v=[\w.-]+/.exec(document.currentScript.previousElementSibling.src) || [''])[0];
          ['api.js', 'lib/shared.js'].forEach(function (file) {
            var link = document.createElement('link');
            link.rel = 'modulepreload';
            link.href = file + version;
            document.head.appendChild(link);
          });
          var url = (window.WISHLIST_CONFIG || {}).API;
          var tg = window.Telegram && window.Telegram.WebApp;
          var initData = (tg && tg.initData) || new URLSearchParams(location.hash.slice(1)).get('tgWebAppData') || '';
          if (!url || !initData) return;
          var list = fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'list', payload: { client: screenInfo() }, initData: initData }),
          });
          list.catch(function () {}); // api.js reports failures and tries again
          window.WISHLIST_EARLY = { url: url, initData: initData, list: list };
        } catch (error) {
          // app.js asks for the list itself
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="sheets"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
