# Publishes the app (the public/ folder) to GitHub Pages whenever main changes.
# One-time: repository Settings → Pages → Source: "GitHub Actions".
name: Publish the app

on:
  push:
    # GitHub publishes only from the repository's default branch (for now the
    # claude/… branch; switching the default to main in Settings also works).
    branches: [main, claude/bold-cerf-acz1wo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
