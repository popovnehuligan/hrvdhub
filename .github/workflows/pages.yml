# Publishes the app (the public/ folder) to GitHub Pages whenever main changes.
# One-time: repository Settings → Pages → Source: "GitHub Actions".
name: Publish the app

on:
  push:
    # GitHub publishes only from the repository's default branch (for now the
    # claude/… branch; switching the default to main in Settings also works).
    branches: [main, claude/bold-cerf-acz1wo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # GitHub Pages takes deployments only from the repository's default branch; elsewhere
    # (pushes to main while it isn't the default) the job is skipped instead of failing.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Stamp file versions
        # Telegram keeps old copies of the app; a new address per publish makes it load the new files.
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s#(src|href)=\"(config\.js|styles\.css|app\.js)\"#\1=\"\2?v=$v\"#g" public/index.html
          find public -name '*.js' -not -path 'public/setup/*' -exec sed -i -E "s#(from '\.\.?/[^']+\.js)'#\1?v=$v'#g" {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
